version: '3.8'

services:
  app:
    build: 
      context: .
      target: server
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/subscription?sslmode=disable
      - PORT=8080
    depends_on:
      - db
      - migrator
    restart: unless-stopped

  migrator:
    build:
      context: .
      target: migrator
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/subscription?sslmode=disable
    depends_on:
      - db
    restart: on-failure

  db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=subscriptions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: